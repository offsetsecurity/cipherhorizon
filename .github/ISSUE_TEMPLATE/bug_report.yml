name: Bug report
description: Something doesn't work the way it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. **If this is a security vulnerability, please follow
        [SECURITY.md](../../SECURITY.md) instead of filing a public issue.**
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce it
      description: >
        Exact command(s) or UI steps. If it involves a TLS scan, please reproduce against
        `cmd/demo-targets` (see testing/README.md) or another target you own — not a third-party host.
      placeholder: |
        1. go run ./cmd/demo-targets
        2. cipherhorizon serve --allow-loopback
        3. Add endpoint 127.0.0.1:9440, scan it, open the Findings tab
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Command output, a screenshot, or a browser console error. Paste text as text, not a screenshot, where you can.
      render: shell
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Output of `cipherhorizon version`, or the git commit you built from.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and architecture
      placeholder: e.g. Windows 11 / amd64, Ubuntu 24.04 / arm64
    validations:
      required: true
