name: pr-title

# Pull requests are squash-merged, so the PR title becomes the commit on main. It must follow
# Conventional Commits (type(scope): summary) because that is what the changelog and the version
# bump are decided from. See docs/engineering/BRANCHING.md.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  title:
    runs-on: ubuntu-latest
    steps:
      - name: Check the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          re='^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert|security)(\([a-z0-9._/-]+\))?!?: .{3,}$'
          if [[ ! "$TITLE" =~ $re ]]; then
            echo "::error::PR title must look like 'fix(tlsprobe): handle empty ServerHello' — got: $TITLE"
            echo "Types: feat fix perf refactor docs test build ci chore revert security. Add ! before the colon for a breaking change."
            exit 1
          fi
