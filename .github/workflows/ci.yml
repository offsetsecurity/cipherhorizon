name: ci

# Runs on every pull request and every push to main, and is called by release.yml so a tag can
# never ship code that did not pass the same checks.
#
# Actions minutes cost money on a private repository (macOS bills 10x, Windows 2x), so:
# - a change that touches only documentation does not run CI;
# - a newer push cancels the run it supersedes;
# - pull requests skip the slow or costly jobs (macOS, fuzzing, release dry-run, container
#   deploy); every push to main and every release still runs everything.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "site/**", "LICENSE", ".github/ISSUE_TEMPLATE/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "site/**", "LICENSE", ".github/ISSUE_TEMPLATE/**"]
  merge_group:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS only on main and releases: its minutes bill at 10x.
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest","windows-latest"]' || '["ubuntu-latest","windows-latest","macos-latest"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        # the race detector needs cgo, which the Linux runner has
        run: go test -count=1 ${{ runner.os == 'Linux' && '-race' || '' }} ./...
      - name: gofmt and go.mod tidy
        if: runner.os == 'Linux'
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; echo "run gofmt -w ."; exit 1; }
          go mod tidy -diff

  cross-build:
    # Static, dependency-free binaries build for every platform the release ships.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Build every release target
        env:
          CGO_ENABLED: "0"
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            echo "== $target"
            GOOS=${target%/*} GOARCH=${target#*/} go build -trimpath -o /dev/null ./cmd/cipherhorizon
            GOOS=${target%/*} GOARCH=${target#*/} go build -trimpath -o /dev/null ./cmd/cipherhorizon-collector
          done

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest
      - name: The workflow files themselves (actionlint)
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck= .github/workflows/*.yml

  upgrade:
    # PRD-016: the latest release, built from its tag, and this commit on the same database. This commit
    # upgrades what the release wrote, and the release then refuses the upgraded file instead of misreading
    # it. Upgrades from every release's real data are TestUpgradeFromEveryRelease, in the test job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Build this commit and the latest release
        run: |
          # the newest release in this commit's history, other than this commit itself (a release run)
          here="$(git tag --points-at HEAD | head -1)"
          prev="$(git tag -l 'v*' --sort=-v:refname --merged HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -vxF -e "${here:-none}" | head -1)"
          test -n "$prev" || { echo "no earlier release tag"; exit 1; }
          echo "latest release: $prev"
          CGO_ENABLED=0 go build -o /tmp/ch-new ./cmd/cipherhorizon
          git worktree add -q --detach /tmp/prev-src "$prev"
          (cd /tmp/prev-src && CGO_ENABLED=0 go build -o /tmp/ch-old ./cmd/cipherhorizon)
      - name: Upgrade a database the release made, then hand it back to the release
        run: |
          set -x
          /tmp/ch-old db stats --db /tmp/u.db >/dev/null       # the release creates its database
          before="$(/tmp/ch-new db status --json --db /tmp/u.db | jq '.pending | length')"
          /tmp/ch-new db migrate --db /tmp/u.db
          /tmp/ch-new db check --db /tmp/u.db
          if [ "$before" -gt 0 ]; then
            if /tmp/ch-old db stats --db /tmp/u.db > /tmp/old.out 2>&1; then
              echo "the release opened a database this commit upgraded"; cat /tmp/old.out; exit 1
            fi
            grep -q "newer than this program" /tmp/old.out || { cat /tmp/old.out; exit 1; }
            # and the backup taken before the upgrade gets it back
            bak="$(/tmp/ch-new db status --json --db /tmp/u.db | jq -r '.backups[0].path')"
            /tmp/ch-new db restore --db /tmp/u.db "$bak"
            /tmp/ch-old db stats --db /tmp/u.db >/dev/null
          else
            /tmp/ch-old db stats --db /tmp/u.db >/dev/null       # same schema: both read it
          fi

  vuln:
    # Known vulnerabilities in the dependencies and the standard library, limited to code that is reachable.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  fuzz:
    # Short smoke run of the parsers that read untrusted network bytes.
    if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Fuzz the wire parsers
        run: |
          for f in FuzzReadFlight FuzzParseServerKeyExchange FuzzReadSSLv2ServerHello; do
            go test ./internal/tlsprobe/wire -run '^$' -fuzz "^${f}\$" -fuzztime 30s
          done
      - name: Fuzz the PE version-resource parser (reads untrusted files from the host)
        run: go test ./internal/sense/pefiles -run '^$' -fuzz '^FuzzReadVersion$' -fuzztime 30s
      - name: Fuzz what people upload (facts files, systems CSV)
        run: |
          go test ./internal/machinefacts -run '^$' -fuzz '^FuzzParseFacts$' -fuzztime 60s
          go test ./internal/server -run '^$' -fuzz '^FuzzImportSystemsCSV$' -fuzztime 60s

  e2e:
    # The shipped UI, driven in a real browser against known demo targets (see testing/e2e).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Check the UI scripts parse
        run: for f in $(find web/static -name '*.js'); do node --check "$f"; done
      - name: Build
        run: |
          mkdir -p dist
          CGO_ENABLED=0 go build -trimpath -o dist/cipherhorizon ./cmd/cipherhorizon
          go build -o dist/demo-targets ./cmd/demo-targets
      - name: Start the demo targets and the server
        env:
          # A throwaway value for this job's own server: the journey's API calls outside the
          # browser use it, since they cannot share the browser's session cookie (authfetch.mjs).
          E2E_TOKEN: e2e-automation-token-0123456789
        run: |
          ./dist/demo-targets > demo.log 2>&1 &
          ./dist/cipherhorizon serve --allow-loopback --sign-in on --token "$E2E_TOKEN" --db e2e.db --addr 127.0.0.1:8090 > serve.log 2>&1 &
          for i in $(seq 1 50); do curl -sf http://127.0.0.1:8090/api/v1/health && break; sleep 0.2; done
      - name: Run the browser journey
        env:
          E2E_SERVER_LOG: serve.log # first-run setup reads the one-time code the server logs
          E2E_TOKEN: e2e-automation-token-0123456789
        run: node testing/e2e/journey.mjs --base http://127.0.0.1:8090 --out artifacts/screenshots
      - name: Live security checks
        run: |
          # the DNS-rebinding checks need a token-less server on :8080
          ./dist/cipherhorizon serve --db open.db --addr 127.0.0.1:8080 > open.log 2>&1 &
          sleep 1
          BIN=dist/cipherhorizon bash testing/e2e/security.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-screenshots
          path: artifacts/screenshots

  deploy:
    # The container as docker-compose.yml runs it (first install, backup, HTTPS, self-scan), and the
    # Linux inventory script on Debian, UBI and Alpine (PRD-007 REQ-DP-1, REQ-DP-5).
    if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Container smoke test
        run: ENGINE=docker bash testing/deploy/smoke.sh
      - name: The Linux inventory script on three distributions
        run: |
          CGO_ENABLED=0 go build -o /tmp/cipherhorizon ./cmd/cipherhorizon
          ENGINE=docker BIN=/tmp/cipherhorizon bash testing/deploy/linux-script.sh

  release-dry-run:
    # Proves the release machinery works on every push to main, not for the first time on a tag.
    if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Check the GoReleaser configuration and build every archive
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=sign,sbom
      - name: Build the container image (not pushed)
        run: |
          docker build -t cipherhorizon:ci \
            --build-arg MODULE="$(go list -m)" --build-arg VERSION=0.0.0-ci --build-arg COMMIT="${GITHUB_SHA}" .
      - name: The image starts and reports its version
        run: docker run --rm cipherhorizon:ci version
      - name: The Linux packages install, run and remove cleanly (Debian, Red Hat UBI)
        run: |
          check='set -e
            test -x /usr/bin/cipherhorizon
            test -f /usr/lib/systemd/system/cipherhorizon.service
            test "$(stat -c %a /etc/cipherhorizon/env)" = 600
            cipherhorizon version | grep -q "^cipherhorizon "'
          docker run --rm -v "$PWD/dist:/dist:ro" debian:12-slim sh -c \
            "apt-get install -y -q /dist/cipherhorizon_*_amd64.deb && $check && apt-get remove -y -q cipherhorizon && ! test -e /usr/bin/cipherhorizon"
          docker run --rm -v "$PWD/dist:/dist:ro" registry.access.redhat.com/ubi9/ubi-minimal:latest sh -c \
            "rpm -i /dist/cipherhorizon-*.x86_64.rpm && $check && rpm -e cipherhorizon && ! test -e /usr/bin/cipherhorizon"
