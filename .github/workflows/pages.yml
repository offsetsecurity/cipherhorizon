name: pages

# The documentation site (site/, PRD-007 REQ-LM-2), published to GitHub Pages from main. The site
# is plain HTML and CSS; its fonts and images are copied in from where the product keeps them, so
# the site and the product never drift apart.
on:
  push:
    branches: [main]
    paths: ["site/**", "docs/img/**", "web/static/fonts/**", "web/static/img/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Assemble the site
        run: |
          mkdir -p _site/img _site/fonts
          cp site/*.html site/*.css _site/
          cp web/static/fonts/*.woff2 web/static/fonts/*-LICENSE.txt _site/fonts/
          cp web/static/img/mark*.svg docs/img/*.png _site/img/
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
