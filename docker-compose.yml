# One-command install: `docker compose up -d`, then open http://127.0.0.1:8080 and scan.
#
# Sign-in is off until you turn it on (Settings in the interface). The port is published on this
# host's loopback only, so only this machine can reach the server while it is open.
#
# Builds the image from the local Dockerfile (no registry image is published yet; once one is,
# replace `build: .` below with `image: ghcr.io/<owner>/cipherhorizon:<version>` and pin a version).
#
# To reach it from other machines, use deploy/compose-caddy.yml (automatic HTTPS for a real host name,
# sign-in always on), or turn sign-in on and serve HTTPS with --tls-cert/--tls-key. Never plain HTTP
# across a network.
#
# Scripts and CI can call the API with an automation token instead of a session. Optional: put one
# in a ".env" file next to this one (compose reads it; .env is gitignored):
#
#   echo "CIPHERHORIZON_TOKEN=$(openssl rand -hex 24)" > .env
#
# Data (the SQLite database, everything the server has observed) lives in the "data" volume, so it
# survives `docker compose down`; use `docker compose down -v` to also remove it. Back it up while
# it runs with:
#
#   docker compose exec cipherhorizon /cipherhorizon db backup --db /data/cipherhorizon.db /data/backup-$(date +%F).db
#
# Hardening (audit L-13): the container's filesystem is read-only except the data volume and a
# small /tmp, it holds no Linux capabilities, it cannot gain privileges, and its process count and
# memory are bounded. testing/deploy/smoke.sh runs exactly this configuration.

services:
  cipherhorizon:
    build: .
    container_name: cipherhorizon
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      CIPHERHORIZON_TOKEN: ${CIPHERHORIZON_TOKEN:-}
    volumes:
      - data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    # The image itself declares a HEALTHCHECK (the base image has no shell, curl or wget, so
    # the binary checks its own /api/v1/health); nothing to add here.

volumes:
  data:
