# cipherhorizon configuration. Every key is optional; the values below are the defaults
# except where a comment says otherwise. Unknown keys are an error.

output:
  path: ""      # file to write, atomically. Empty = standard output.
  pretty: true  # indent the JSON

host:
  root: /       # where the host filesystem is visible. Use /host in a container that mounts it.
                # (On Windows the default is the system drive, e.g. C:\.)
  name: ""      # hostname recorded as the CBOM's subject. Empty = the OS hostname.
  redact: false # record a stable label derived from the machine id instead of the host name.
                # Refuses to run if the platform offers no machine id.

plugins:         # these are the sensors: "apt" (dpkg hosts), "pe-files" (Windows loose libraries), "windows-cng", "cert-files" (Linux certificate files)
  enabled: []   # run only these sensors. Empty = every registered sensor.
  disabled: []  # never run these.
  timeout: 60s  # per-sensor budget for detect + collect. 0 = unbounded.

pqc:
  enabled: true # annotate algorithms with cited quantum-vulnerable / quantum-safe verdicts
