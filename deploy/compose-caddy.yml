# CipherHorizon behind Caddy, with automatic HTTPS for a real host name (PRD-007 REQ-DP-2).
#
#   1. Point a DNS name at this machine (ports 80 and 443 reachable for the certificate).
#   2. CIPHERHORIZON_HOST=cipherhorizon.example.com docker compose -f deploy/compose-caddy.yml up -d
#   3. docker compose -f deploy/compose-caddy.yml logs cipherhorizon   (the one-time setup code)
#   4. Open https://cipherhorizon.example.com and create the administrator.
#
# Caddy obtains and renews the certificate, terminates TLS and forwards to CipherHorizon over the
# private network. CipherHorizon is not published on any host port: Caddy is the only way in.
# --trusted-proxy names Caddy's network, so sign-in rate limits and the activity log see the real
# client addresses and the session cookie is marked Secure (__Host-ch_session).
#
# Limit what this server may scan with --scan-allow (append it to the command below), for example
#   --scan-allow 10.0.0.0/8 --scan-allow example.com

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      CIPHERHORIZON_HOST: ${CIPHERHORIZON_HOST:?set CIPHERHORIZON_HOST to the DNS name}
    command: ["caddy", "reverse-proxy", "--from", "${CIPHERHORIZON_HOST}", "--to", "cipherhorizon:8080"]
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    networks: [front]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]

  cipherhorizon:
    build: ..
    restart: unless-stopped
    # Reachable from the internet through Caddy: sign-in is always on here.
    command: ["serve", "--addr", "0.0.0.0:8080", "--plain-http", "--sign-in", "on", "--trusted-proxy", "172.30.0.0/24", "--db", "/data/cipherhorizon.db"]
    environment:
      CIPHERHORIZON_TOKEN: ${CIPHERHORIZON_TOKEN:-}
    volumes:
      - data:/data
    networks: [front]
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 1g

networks:
  front:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  data:
  caddy-data:
  caddy-config:
